<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Assistant - PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #1e293b; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; flex-shrink: 0; }
        .avatar-container { display: flex; align-items: center; gap: 12px; }
        .avatar-ring { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #8b5cf6); padding: 2px; display: flex; align-items: center; justify-content: center; animation: pulse 2s infinite; }
        .avatar-face { width: 100%; height: 100%; background: #0f172a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .status-info h1 { font-size: 16px; font-weight: 600; }
        .status-info p { font-size: 12px; color: #94a3b8; }
        .chat-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word; white-space: pre-wrap; }
        .message.user { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.bot { background: #1e293b; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        .input-container { padding: 12px 16px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 8px; flex-shrink: 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
        input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 24px; padding: 12px 16px; color: white; font-size: 14px; outline: none; }
        input:focus { border-color: #3b82f6; }
        button { background: #3b82f6; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; flex-shrink: 0; }
        button:active { transform: scale(0.95); }
        button:disabled { background: #475569; cursor: not-allowed; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
    </style>
</head>
<body>
    <header>
        <div class="avatar-container">
            <div class="avatar-ring" id="avatarRing">
                <div class="avatar-face">🤖</div>
            </div>
            <div class="status-info">
                <h1>AI Assistant</h1>
                <p id="statusText">Bereit</p>
            </div>
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message bot" id="welcomeMsg">Hallo! Ich lade ein kompaktes KI-Modell direkt in deinen Browser. Der erste Start dauert einen Moment (das Modell wird aus dem Netz geholt) — danach arbeite ich auch offline.</div>
    </div>

    <!-- Fortschrittbalken -->
    <div id="progressContainer" style="padding: 10px 16px; background: #1e293b; border-top: 1px solid #334155; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8;">
            <span id="progressText">Initialisiere...</span>
            <span id="progressPercent">0%</span>
        </div>
        <div style="width: 100%; height: 6px; background: #0f172a; border-radius: 3px; overflow: hidden;">
            <div id="progressBar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); transition: width 0.2s ease;"></div>
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Modell wird geladen..." disabled autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()" disabled>⌛</button>
    </div>

    <script type="module">
        // transformers.js: laeuft ohne WebGPU (WebAssembly-CPU-Rueckfall), nutzt GPU nur wenn vorhanden.
        // Damit funktioniert es robust in Chrome/Edge, auch wenn WebGPU nicht hart beschleunigt.
        import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.1.2";

        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusText = document.getElementById('statusText');
        const avatarRing = document.getElementById('avatarRing');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');
        const welcomeMsg = document.getElementById('welcomeMsg');

        let generator = null;
        // Fuer Browser-Inspektion/Debugging verfuegbar machen
        window.generator = generator;

        // Kompaktes, im Browser bewaehrtes ONNX-Chain-Modell (SmolLM2-135M, q4-Quantisierung)
        const MODEL_ID = "onnx-community/SmolLM2-135M-Instruct-ONNX";

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function setStatus(text, thinking = false) {
            statusText.textContent = text;
            avatarRing.style.animationDuration = thinking ? "0.6s" : "2s";
        }

        function setProgress(pct, label) {
            progressBar.style.width = pct + '%';
            progressPercent.textContent = Math.round(pct) + '%';
            progressText.textContent = label;
        }

        async function initLLM() {
            try {
                setStatus("Lade kompaktes KI-Modell...");
                // Modelle werden im Browser-Cache wiederverwendet
                env.allowLocalModels = false;  // immer vom Hub laden
                env.useBrowserCache = true;    // bereits geladene Teile wiederverwenden

                env.onProgress = (item) => {
                    if (item.status === 'progress' && item.total > 0) {
                        const pct = Math.round(100 * item.loaded / item.total);
                        setProgress(pct, item.file || 'Modell wird geladen...');
                    } else if (item.status === 'done' || item.status === 'ready') {
                        setProgress(100, 'Modell bereit');
                    }
                };

                // WebGPU nutzen falls verfuegbar, sonst CPU/WASM (laeuft IMMER)
                const device = ('gpu' in navigator && navigator.gpu) ? 'webgpu' : 'wasm';
                generator = await pipeline('text-generation', MODEL_ID, { device: device, dtype: 'q4' });
                window.generator = generator; // Fuer Browser-Debugging
                progressContainer.style.display = 'none';
                setStatus(device === 'webgpu' ? "KI-Modell bereit (GPU)" : "KI-Modell bereit (CPU)");
                userInput.disabled = false;
                userInput.placeholder = "Schreibe eine Nachricht...";
                sendBtn.disabled = false;
                sendBtn.textContent = "➤";
                welcomeMsg.textContent = "Das kompakte KI-Modell ist geladen! Du kannst direkt losschreiben.";
            } catch (err) {
                console.error(err);
                progressContainer.style.display = 'none';
                setStatus("Modell konnte nicht geladen werden");
                welcomeMsg.textContent = "Das KI-Modell konnte nicht geladen werden (Details in der Browser-Konsole, F12). Bitte Seite neu laden oder Netzwerk pruefen.";
            }
        }

        window.sendMessage = async function() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            setStatus("Generiert...", true);

            if (generator) {
                const botMsgDiv = addMessage("", 'bot');
                try {
                    const result = await generator(
                        [{ role: "user", content: text }],
                        { max_new_tokens: 200, do_sample: true, top_k: 40, temperature: 0.7, return_full_text: false }
                    );
                    let reply = "";
                    if (Array.isArray(result?.[0]?.generated_text)) {
                        // transformers.js v3: generated_text ist ein Array von Chat-Messages
                        const last = result[0].generated_text[result[0].generated_text.length - 1];
                        reply = (last && last.content) || "";
                    } else {
                        reply = result?.[0]?.generated_text || "";
                    }
                    if (!reply) reply = "Keine Antwort.";
                    // Chat-Marker/Template-Reste minimal reinigen
                    reply = String(reply).replace(/<\|im_\|>/g, '').replace(/<s|<\/s><\|/g, '').trim();
                    botMsgDiv.textContent = reply;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                } catch (err) {
                    console.error(err);
                    botMsgDiv.textContent = "Fehler beim Generieren: " + err.message;
                }
                setStatus("Bereit");
            } else {
                addMessage("Das Modell ist noch nicht bereit.", 'bot');
                setStatus("Bereit");
            }
        };

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        initLLM();
    </script>
</body>
</html>
