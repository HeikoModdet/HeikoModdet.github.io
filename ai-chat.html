<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heiko AI Assistant - PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #1e293b; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; flex-shrink: 0; }
        .avatar-container { display: flex; align-items: center; gap: 12px; }
        .avatar-ring { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #8b5cf6); padding: 2px; display: flex; align-items: center; justify-content: center; animation: pulse 2s infinite; }
        .avatar-face { width: 100%; height: 100%; background: #0f172a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .status-info h1 { font-size: 16px; font-weight: 600; }
        .status-info p { font-size: 12px; color: #94a3b8; }
        .chat-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .message.user { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.bot { background: #1e293b; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        .input-container { padding: 12px 16px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 8px; flex-shrink: 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
        input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 24px; padding: 12px 16px; color: white; font-size: 14px; outline: none; }
        input:focus { border-color: #3b82f6; }
        button { background: #3b82f6; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; flex-shrink: 0; }
        button:active { transform: scale(0.95); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
    </style>
</head>
<body>
    <header>
        <div class="avatar-container">
            <div class="avatar-ring" id="avatarRing">
                <div class="avatar-face">🤖</div>
            </div>
            <div class="status-info">
                <h1>Heiko AI Assistant</h1>
                <p id="statusText">Bereit & Offline-fähig</p>
            </div>
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message bot">Hallo Heiko! Ich bin dein lokaler Assistent (mit integrierten Ideen von helpfully.de für Vorlagen & Projekte). Wie kann ich dir heute helfen?</div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Nachricht eingeben..." autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const statusText = document.getElementById('statusText');
        const avatarRing = document.getElementById('avatarRing');

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function setThinking(thinking) {
            statusText.textContent = thinking ? "Denkt nach..." : "Bereit & Offline-fähig";
            avatarRing.style.animationDuration = thinking ? "0.6s" : "2s";
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            setThinking(true);

            setTimeout(() => {
                let reply = "Das ist ein sehr interessanter Punkt! Lass uns das schrittweise angehen. Was genau möchtest du dazu wissen oder umsetzen?";
                const lower = text.toLowerCase();
                
                if (lower.includes('hallo') || lower.includes('hi') || lower.includes('guten tag')) {
                    reply = "Hallo Heiko! Schön, dass du da bist. Wie kann ich dir heute bei deinen Projekten oder Ideen helfen?";
                } else if (lower.includes('bastel') || lower.includes('vorlagen') || lower.includes('helpfully')) {
                    reply = "Ah, rund um Bastelvorlagen und kreative DIY-Projekte (wie von helpfully.de) habe ich jede Menge Ideen auf Lager! Suchst du nach einer bestimmten Vorlage oder einem Thema für Kinder?";
                } else if (lower.includes('hilfe') || lower.includes('was kannst du')) {
                    reply = "Ich bin dein persönlicher KI-Assistent direkt auf dem Smartphone! Du kannst mich zu allen möglichen Themen befragen, Ideen entwickeln, Texte schreiben oder kreative Projekte planen.";
                } else if (lower.includes('witz') || lower.includes('erzähle')) {
                    reply = "Warum können Programmierer die Natur nicht leiden? – Weil sie zu viele Bugs hat! 😄";
                } else if (lower.length > 15) {
                    reply = `Das klingt nach einem spannenden Projekt: "${text}". Um das optimal umzusetzen, könnten wir das in kleine Teilschritte zerlegen. Sollen wir direkt mit dem ersten Schritt starten?`;
                }

                addMessage(reply, 'bot');
                setThinking(false);
            }, 1000);
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
