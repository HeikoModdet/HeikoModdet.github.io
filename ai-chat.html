<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heiko AI Assistant - PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #1e293b; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; flex-shrink: 0; }
        .avatar-container { display: flex; align-items: center; gap: 12px; }
        .avatar-ring { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #8b5cf6); padding: 2px; display: flex; align-items: center; justify-content: center; animation: pulse 2s infinite; }
        .avatar-face { width: 100%; height: 100%; background: #0f172a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .status-info h1 { font-size: 16px; font-weight: 600; }
        .status-info p { font-size: 12px; color: #94a3b8; }
        .chat-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .message.user { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.bot { background: #1e293b; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        .input-container { padding: 12px 16px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 8px; flex-shrink: 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
        input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 24px; padding: 12px 16px; color: white; font-size: 14px; outline: none; }
        input:focus { border-color: #3b82f6; }
        button { background: #3b82f6; border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; flex-shrink: 0; }
        button:active { transform: scale(0.95); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
    </style>
</head>
<body>
    <header>
        <div class="avatar-container">
            <div class="avatar-ring" id="avatarRing">
                <div class="avatar-face">🤖</div>
            </div>
            <div class="status-info">
                <h1>Heiko AI Assistant</h1>
                <p id="statusText">Bereit & Offline-fähig</p>
            </div>
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message bot" id="welcomeMsg">Hallo Heiko! Ich lade das lokale KI-Modell (Llama 3.2 1B) direkt in deinen Browser. Bitte warte kurz...</div>
    </div>

    <!-- Fortschrittbalken -->
    <div id="progressContainer" style="padding: 10px 16px; background: #1e293b; border-top: 1px solid #334155; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8;">
            <span id="progressText">Initialisiere WebGPU...</span>
            <span id="progressPercent">0%</span>
        </div>
        <div style="width: 100%; height: 6px; background: #0f172a; border-radius: 3px; overflow: hidden;">
            <div id="progressBar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); transition: width 0.2s ease;"></div>
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Lade lokales Modell..." disabled autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()" disabled>⌛</button>
    </div>

    <script type="module">
        import { CreateWebWorkerMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusText = document.getElementById('statusText');
        const avatarRing = document.getElementById('avatarRing');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');
        const welcomeMsg = document.getElementById('welcomeMsg');

        let engine = null;
        const selectedModel = "Llama-3.2-1B-Instruct-q4f16_1-MLC";

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function setStatus(text, thinking = false) {
            statusText.textContent = text;
            avatarRing.style.animationDuration = thinking ? "0.6s" : "2s";
        }

        async function initLLM() {
            try {
                setStatus("Lade lokales Modell...");
                engine = await CreateWebWorkerMLCEngine(
                    new Worker(
                        URL.createObjectURL(new Blob([`
                            import { WebWorkerMLCEngineHandler } from "https://esm.run/@mlc-ai/web-llm";
                            const handler = new WebWorkerMLCEngineHandler();
                            onmessage = (msg) => handler.onmessage(msg);
                        `], { type: "javascript" })),
                        { type: "module" }
                    ),
                    selectedModel,
                    {
                        initProgressCallback: (report) => {
                            progressText.textContent = report.text;
                            // Versuche Prozentsatz aus dem Text zu extrahieren falls vorhanden
                            const match = report.text.match(/(\d+)%/);
                            if (match) {
                                const pct = match[1];
                                progressBar.style.width = pct + '%';
                                progressPercent.textContent = pct + '%';
                            } else {
                                // Pulsierender Fortschritt bei ungenauen Berichten
                                progressBar.style.width = '70%';
                                progressPercent.textContent = '...';
                            }
                            statusText.textContent = report.text;
                        }
                    }
                );
                
                // Ausblenden des Fortschrittbalkens nach Erfolg
                progressContainer.style.display = 'none';
                setStatus("Lokales KI-Modell bereit");
                userInput.disabled = false;
                userInput.placeholder = "Schreibe dem lokalen KI-Modell...";
                sendBtn.disabled = false;
                sendBtn.textContent = "➤";
                welcomeMsg.textContent = "Das lokale KI-Modell ist geladen und läuft komplett privat in deinem Browser! Wie kann ich dir helfen?";
            } catch (err) {
                console.error(err);
                progressContainer.style.display = 'none';
                setStatus("Fehler (WebGPU benötigt)");
                welcomeMsg.textContent = "Hinweis: Dein Browser/Gerät unterstützt möglicherweise kein WebGPU. Fallback-Modus aktiv.";
                userInput.disabled = false;
                userInput.placeholder = "Nachricht eingeben...";
                sendBtn.disabled = false;
                sendBtn.textContent = "➤";
            }
        }

        window.sendMessage = async function() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            setStatus("Generiert...", true);

            if (engine) {
                const botMsgDiv = addMessage("", 'bot');
                try {
                    const messages = [
                        { role: "system", content: "Du bist Heikos hilfsreicher, direkter und freundlicher KI-Assistent auf Deutsch. Du kennst dich mit Projekten, Ideen und Kreativität (wie helpfully.de) aus." },
                        { role: "user", content: text }
                    ];
                    const chunks = await engine.chat.completions.create({ messages, stream: true });
                    let reply = "";
                    for await (const chunk of chunks) {
                        reply += chunk.choices[0]?.delta?.content || "";
                        botMsgDiv.textContent = reply;
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                } catch (err) {
                    botMsgDiv.textContent = "Fehler bei der lokalen Generierung: " + err.message;
                }
                setStatus("Bereit");
            } else {
                // Fallback wenn WebGPU nicht verfügbar
                setTimeout(() => {
                    addMessage("Das ist eine spannende Frage zu: \"" + text + "\". (Im Fallback-Modus ohne WebGPU)", 'bot');
                    setStatus("Bereit");
                }, 1000);
            }
        };

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        initLLM();
    </script>
</body>
</html>
